  <style>
    :root {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #0f766e;
      --d1: #c2410c;
      --d2: #15803d;
      --d3: #0369a1;
      --d4: #7e22ce;
      --d5: #b91c1c;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", Arial, sans-serif; color: var(--text); background: var(--bg); }
    body { overflow: hidden; }
    .app { display: grid; grid-template-columns: minmax(340px, 38%) 1fr; height: 100vh; }
    .sidebar { background: var(--panel); border-right: 1px solid var(--border); overflow-y: auto; }
    .header { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.96); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); padding: 18px 18px 14px; }
    h1 { font-size: 20px; line-height: 1.35; margin: 0 0 6px; }
    .sub { font-size: 13px; color: var(--muted); line-height: 1.5; }
    .summary { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .pill { font-size: 12px; padding: 5px 8px; border-radius: 999px; background: #f3f4f6; border: 1px solid var(--border); }
    .toolbar { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 12px; }
    button { border: 1px solid var(--border); background: #fff; color: var(--text); border-radius: 8px; padding: 7px 9px; cursor: pointer; font-size: 12px; }
    button:hover { background: #f9fafb; }
    button.active { background: #111827; color: #fff; border-color: #111827; }
    .day-buttons button[data-day="1"].active { background: var(--d1); border-color: var(--d1); }
    .day-buttons button[data-day="2"].active { background: var(--d2); border-color: var(--d2); }
    .day-buttons button[data-day="3"].active { background: var(--d3); border-color: var(--d3); }
    .day-buttons button[data-day="4"].active { background: var(--d4); border-color: var(--d4); }
    .day-buttons button[data-day="5"].active { background: var(--d5); border-color: var(--d5); }
    .filters { padding: 10px 18px 0; display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
    .filters label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
    .days { padding: 10px 14px 28px; }
    .day { margin: 8px 0 18px; }
    .day-title { display: flex; align-items: baseline; justify-content: space-between; padding: 7px 5px; border-bottom: 1px solid var(--border); margin-bottom: 5px; }
    .day-title strong { font-size: 15px; }
    .day-title span { font-size: 12px; color: var(--muted); }
    .item { display: grid; grid-template-columns: 62px 1fr; gap: 8px; padding: 9px 7px; border-radius: 9px; cursor: pointer; border: 1px solid transparent; }
    .item:hover { background: #f9fafb; border-color: #f3f4f6; }
    .item.hidden { display: none; }
    .time { font-size: 12px; color: var(--muted); padding-top: 2px; }
    .name-row { display: flex; gap: 7px; align-items: center; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 10px; }
    .name { font-weight: 650; font-size: 13px; line-height: 1.35; }
    .meta { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.45; }
    .walk-badge { display:inline-block; margin-left:6px; padding:2px 6px; border-radius:999px; font-size:10px; font-weight:700; vertical-align:1px; }
    .walk-low { background:#ecfdf5; color:#166534; border:1px solid #bbf7d0; }
    .walk-mid { background:#fffbeb; color:#92400e; border:1px solid #fde68a; }
    main { min-width: 0; min-height: 0; height: 100%; }
    #map { height: 100%; width: 100%; min-height: 0; background: #e5e7eb; }
    .leaflet-popup-content-wrapper { border-radius: 10px; }
    .popup { min-width: 220px; }
    .popup h3 { margin: 0 0 6px; font-size: 15px; }
    .popup .when { font-size: 12px; color: var(--muted); margin-bottom: 7px; }
    .popup p { margin: 6px 0 10px; font-size: 12px; line-height: 1.55; }
    .popup a { display: inline-block; text-decoration: none; font-size: 12px; padding: 7px 9px; border-radius: 7px; background: #03c75a; color: #fff; font-weight: 700; }
    .popup .small { font-size: 11px; color: var(--muted); margin-top: 7px; }
    .legend { background: rgba(255,255,255,.94); padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.12); font-size: 11px; line-height: 1.7; }

    .route-note { position: absolute; right: 12px; bottom: 12px; z-index: 500; background: rgba(255,255,255,.93); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 11px; color: var(--muted); max-width: 290px; }
    @media (max-width: 820px) {

      #map { min-height: 52vh; }
      .header { position: static; }
    }
    @media print {

      #map { height: 520px; margin-top: 16px; }

  </style>
</head>

      {id:'busan-dinner',day:4,date:'11/30 월',time:'18:00~19:30',name:'부산 저녁',type:'meal',lat:35.1610,lng:129.1600,note:'숙소 근처에서 저녁식사.',naver:'해운대 맛집'},
      {id:'busan-stay2',day:4,date:'11/30 월',time:'19:30 이후',name:'부산 2박째',type:'stay',lat:35.1610,lng:129.1600,note:'이날 일정 종료.',naver:'부산 해운대 호텔'},

      {id:'busan-breakfast',day:5,date:'12/1 화',time:'07:30~08:20',name:'부산 아침식사',type:'meal',lat:35.1610,lng:129.1600,note:'08:30 전후 안동으로 출발.',naver:'해운대 아침식사'},
      {id:'hahoe',day:5,date:'12/1 화',time:'11:15~12:45',name:'안동 하회마을',type:'sight',lat:36.5396,lng:128.5183,note:'공용주차장~마을 셔틀버스는 무료. 만송정과 중심 고택 위주로 약 1시간 30분 관람.',naver:'안동 하회마을'},
      {id:'andong-lunch',day:5,date:'12/1 화',time:'12:50~13:50',name:'안동 점심',type:'meal',lat:36.5390,lng:128.5200,note:'하회마을 주변에서 식사 후 바로 고양으로 출발.',naver:'안동 하회마을 맛집'},
      {id:'home',day:5,date:'12/1 화',time:'17:00~18:00 예상',name:'고양 귀가',type:'start',lat:37.6584,lng:126.8320,note:'수도권 교통에 따라 도착시간 변동. 하회별신굿탈놀이는 14시 공연이라 이번 기본 일정에서는 제외.',naver:'고양시청'}
    ];

    const map = L.map('map', {zoomControl:true}).setView([36.0, 127.8], 7);

    const osmUrl = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
    const osmOptions = {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors',
      updateWhenIdle: true,
      referrerPolicy: 'strict-origin-when-cross-origin'
    };

    // OSM requires a Referer for web pages. Pages opened directly as file:// cannot
    // provide one, so identify this local map with X-Requested-With instead.
    // OSM explicitly permits this fallback for local/native-style clients.
    const LocalOsmTileLayer = L.TileLayer.extend({
      createTile: function(coords, done) {
        const tile = document.createElement('img');
        tile.alt = '';
        tile.setAttribute('role', 'presentation');
        tile.referrerPolicy = 'strict-origin-when-cross-origin';

        const controller = new AbortController();
        tile._osmAbortController = controller;

        fetch(this.getTileUrl(coords), {
          mode: 'cors',
          cache: 'default',
          signal: controller.signal,
          headers: {
            'X-Requested-With': 'KoreaRoadTripMap-2026-11'
          }
        })
          .then(response => {
            if (!response.ok) throw new Error('OSM tile HTTP ' + response.status);
            return response.blob();
          })
          .then(blob => {
            const objectUrl = URL.createObjectURL(blob);
            tile._osmObjectUrl = objectUrl;
            tile.onload = () => {
              URL.revokeObjectURL(objectUrl);
              tile._osmObjectUrl = null;
              done(null, tile);
            };
            tile.onerror = event => {
              URL.revokeObjectURL(objectUrl);
              tile._osmObjectUrl = null;
              done(event, tile);
            };
            tile.src = objectUrl;
          })
          .catch(error => {
            if (error.name !== 'AbortError') {
              console.error('OSM tile load failed:', error);
              done(error, tile);
            }
          });

        return tile;
      },

      _removeTile: function(key) {
        const entry = this._tiles[key];
        if (entry && entry.el) {
          if (entry.el._osmAbortController) entry.el._osmAbortController.abort();
          if (entry.el._osmObjectUrl) URL.revokeObjectURL(entry.el._osmObjectUrl);
        }
        L.GridLayer.prototype._removeTile.call(this, key);
      }
    });

    const baseTiles = (location.protocol === 'file:'
      ? new LocalOsmTileLayer(osmUrl, osmOptions)
      : L.tileLayer(osmUrl, osmOptions)
    ).addTo(map);

    const markerById = {};
    const routeByDay = {};
    let activeDay = 'all';
    let routesVisible = true;
    const typeEnabled = {sight:true, meal:true, stay:true, start:true};

    function naverUrl(q) {
      return 'https://map.naver.com/p/search/' + encodeURIComponent(q);
    }

    function markerStyle(day, type) {
      const fill = COLORS[day];
      const radius = type === 'stay' ? 9 : type === 'meal' ? 8 : type === 'start' ? 9 : 7;
      return {radius, color:'#ffffff', weight:2, fillColor:fill, fillOpacity:type==='stay'?.75:.95};
    }

    points.forEach(p => {
      const m = L.circleMarker([p.lat, p.lng], markerStyle(p.day, p.type));
      const html = `<div class="popup">
        <h3>${p.name}</h3>
        <div class="when">${p.date} · ${p.time} · ${TYPE_LABEL[p.type]}</div>
        <p>${p.note}</p>
        <a href="${naverUrl(p.naver)}" target="_blank" rel="noopener">네이버지도에서 열기</a>
        <div class="small">※ 실제 내비 경로는 네이버지도에서 현재 위치/출발지를 지정하세요.</div>
      </div>`;
      m.bindPopup(html);
      m.addTo(map);
      markerById[p.id] = m;
    });

    for (let d=1; d<=5; d++) {
      const coords = points.filter(p=>p.day===d).map(p=>[p.lat,p.lng]);
      routeByDay[d] = L.polyline(coords, {color:COLORS[d], weight:3, opacity:.65, dashArray:'8 7'}).addTo(map);
    }

    const legend = L.control({position:'topright'});
    legend.onAdd = () => {
      const div = L.DomUtil.create('div','legend');
      div.innerHTML = [1,2,3,4,5].map(d=>`<div class="legend-row"><span class="legend-swatch" style="background:${COLORS[d]}"></span> ${d}일차</div>`).join('');
      return div;
    };
    legend.addTo(map);

    const daysEl = document.getElementById('days');
    const dayNames = {
      1:'11/27 금 · 고양 → 천안 → 전주',
      2:'11/28 토 · 전주 → 순천 → 여수',
      3:'11/29 일 · 여수 → 부산',
      4:'11/30 월 · 부산 관광',
      5:'12/1 화 · 부산 → 안동 → 고양'
    };

    function renderList() {
      daysEl.innerHTML = '';
      for (let d=1; d<=5; d++) {
        const section = document.createElement('section');
        section.className = 'day';
        section.dataset.day = d;
        const items = points.filter(p=>p.day===d);
        const title = document.createElement('div');
        title.className = 'day-title';
        title.innerHTML = `<strong>${d}일차</strong><span>${dayNames[d]}</span>`;
        section.appendChild(title);
        items.forEach(p => {
          const el = document.createElement('div');
          el.className = 'item';
          el.dataset.id = p.id;
          el.dataset.type = p.type;
          el.innerHTML = `<div class="time">${p.time}</div><div><div class="name-row"><span class="dot" style="background:${COLORS[d]}"></span><span class="name">${p.name}</span></div><div class="meta">${TYPE_LABEL[p.type]} · ${p.note}</div></div>`;
          el.addEventListener('click', () => {
            map.setView([p.lat,p.lng], p.type==='start'?10:14, {animate:true});
            markerById[p.id].openPopup();
          });
          section.appendChild(el);
        });
        daysEl.appendChild(section);
      }
    }
    renderList();

    function updateVisibility() {
      points.forEach(p => {
        const visible = (activeDay==='all' || Number(activeDay)===p.day) && typeEnabled[p.type];
        const m = markerById[p.id];
        if (visible && !map.hasLayer(m)) m.addTo(map);
        if (!visible && map.hasLayer(m)) map.removeLayer(m);
      });
      for (let d=1; d<=5; d++) {
        const show = routesVisible && (activeDay==='all' || Number(activeDay)===d);
        if (show && !map.hasLayer(routeByDay[d])) routeByDay[d].addTo(map);
        if (!show && map.hasLayer(routeByDay[d])) map.removeLayer(routeByDay[d]);
      }
      document.querySelectorAll('.day').forEach(sec => {
        sec.style.display = (activeDay==='all' || Number(activeDay)===Number(sec.dataset.day)) ? '' : 'none';
      });
      document.querySelectorAll('.item').forEach(el => {
        el.classList.toggle('hidden', !typeEnabled[el.dataset.type]);
      });
      fitVisible();
    }

    function fitVisible() {
      const visiblePoints = points.filter(p => (activeDay==='all' || Number(activeDay)===p.day) && typeEnabled[p.type]);
      if (!visiblePoints.length) return;
      const bounds = L.latLngBounds(visiblePoints.map(p=>[p.lat,p.lng]));
      map.invalidateSize(false);
      map.fitBounds(bounds, {padding:[35,35], maxZoom:13});
    }

    document.querySelectorAll('.day-buttons button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.day-buttons button').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        activeDay = btn.dataset.day;
        updateVisibility();
      });
    });

    document.querySelectorAll('.filters input').forEach(cb => {
      cb.addEventListener('change', () => {
        typeEnabled[cb.dataset.type] = cb.checked;
        updateVisibility();
      });
    });

    document.getElementById('fitAll').addEventListener('click', fitVisible);
    document.getElementById('toggleRoutes').addEventListener('click', (e) => {
      routesVisible = !routesVisible;
      e.target.textContent = routesVisible ? '경로선 숨기기' : '경로선 보이기';
      updateVisibility();
    });

    // Recalculate Leaflet's viewport whenever the grid/map container changes size.
    const mapEl = document.getElementById('map');
    if ('ResizeObserver' in window) {
      const resizeObserver = new ResizeObserver(() => map.invalidateSize(false));
      resizeObserver.observe(mapEl);
    }
    window.addEventListener('resize', () => map.invalidateSize(false));
    window.addEventListener('load', () => {
      requestAnimationFrame(() => {
        map.invalidateSize(false);
        fitVisible();
      });
    });

    fitVisible();
  </script>
</body>
</html>
